name: site-quality
on:
  pull_request:
    paths:
      - 'site/**'
      - 'analytics-collector/**'
      - 'firebase.json'
      - 'scripts/verify-site.mjs'
      - 'scripts/deploy-forkit-ai-gcp.sh'
      - '.github/workflows/site-quality.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'analytics-collector/**'
      - 'firebase.json'
      - 'scripts/verify-site.mjs'
      - 'scripts/deploy-forkit-ai-gcp.sh'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-site.mjs
      - run: node --check analytics-collector/server.js
      - run: bash -n scripts/deploy-forkit-ai-gcp.sh
