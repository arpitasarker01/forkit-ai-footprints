name: macOS compatibility

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: macos-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controlled-compatibility:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'macos-compatibility')
    name: ${{ matrix.name }} / Node 22
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 14 / Apple Silicon
            runner: macos-14
          - name: macOS 15 / Apple Silicon
            runner: macos-15
          - name: macOS 15 / Intel
            runner: macos-15-intel
          - name: macOS 26 / Apple Silicon
            runner: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Record controlled environment
        run: |
          sw_vers
          uname -m
          node --version
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      - name: Validate real runner privacy and stability
        run: npm run validate:macos
      - name: Run isolated package smoke
        run: npm run smoke:package
