name: Support question
description: Ask for help with installation or supported product behavior
title: "[Support]: "
labels: [question, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please keep this report safe for a public repository. Do not post prompts, credentials, account identity, device names, full paths, private model names, or unredacted terminal output. Report security and privacy vulnerabilities through the private Security Advisory form.
  - type: input
    id: version
    attributes:
      label: AI Footprints version
      description: Run `forkit-ai-footprints --version`.
      placeholder: 0.2.6
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation or update
        - Monitoring controls
        - Activity timeline or observation
        - Local model or runtime discovery
        - Community Preview consent or sync
        - Sharing
        - Localization or accessibility
        - Other supported behavior
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to do and where you are blocked.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Supported environment
      description: macOS major, Apple Silicon family, and Node.js major only.
      placeholder: macOS 15, Apple M-series, Node 22
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, credentials, account identity, device names, full paths, and other private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
